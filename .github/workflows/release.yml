name: Release
on:
  push:
    branches:
      - main
      - v4

# The `verify-*` jobs below are the release gate (VS-062): nothing is published from a commit whose
# build, unit tests or e2e are red. `build-test.yml` also runs on push to `main`, but it is a *sibling*
# workflow — it cannot block this one, so a publish could otherwise race a failing test suite. These jobs
# deliberately use `run-many` rather than `nx affected`: the question at release time is whether the whole
# release commit is green, not whether the diff since the last commit is.
jobs:
  verify-build-test:
    name: 'Gate: build & test'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec nx run-many --target=build --projects="ts-rest*"
      # `non-strict-mode-test` is not a `ts-rest*` project, but it is the guard that the public types still
      # infer correctly for consumers without `strict` — it has to be in the gate explicitly.
      - run: pnpm exec nx run-many --target=test --projects="ts-rest*,non-strict-mode-test"

  verify-e2e:
    name: 'Gate: e2e'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v3
        with:
          node-version: 20
      - uses: oven-sh/setup-bun@v2
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec nx run-many --target=build --projects="ts-rest*"
      - name: 'E2E Tests 🧪'
        run: make e2e

  build:
    needs: [verify-build-test, verify-e2e]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      id-token: write
      packages: write
      pull-requests: write
      issues: read
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v3

      # Trusted publishing (OIDC) needs npm >= 11.5.1; Node 24 ships npm 11. Pinned rather than relying on the
      # runner's default Node. No `registry-url`: it would inject NODE_AUTH_TOKEN and shadow the OIDC exchange.
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check npm supports trusted publishing
        run: npx --yes semver@7 -r '>=11.5.1' "$(npm --version)"

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "pnpm_cache_dir=$(pnpm store path)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v3
        name: Setup pnpm cache
        with:
          path: ${{ steps.pnpm-cache.outputs.pnpm_cache_dir }}
          key: "${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}"
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Get release version
        id: release-version
        uses: martinbeentjes/npm-get-version-action@3cf273023a0dda27efcd3164bdfb51908dd46a5b
        with:
          path: libs/ts-rest/core

      - name: Evaluate next release version
        run: pnpm version-packages

      - name: Get next release version
        id: next-release-version
        uses: martinbeentjes/npm-get-version-action@3cf273023a0dda27efcd3164bdfb51908dd46a5b
        with:
          path: libs/ts-rest/core

      - name: Reset changes
        run: git checkout .

      - name: Modify "workspaces" value in package.json
        run: sed -e "s;libs/ts-rest/\*;dist/libs/ts-rest/*;g" package.json > package-new.json && mv package-new.json package.json

      - name: Create Release Pull Request or Publish to npm
        uses: dotansimha/changesets-action@069996e9be15531bd598272996fa23853d61590e
        with:
          title: "release: v${{ steps.next-release-version.outputs.current-version }}"
          commit: "release: v${{ steps.next-release-version.outputs.current-version }}"
          # this expects you to have a script called release which does a build for your packages and calls changeset publish
          publish: pnpm release
          version: pnpm version-packages-update-lockfile
          createGithubReleases: aggregate
          githubReleaseName: v${{ steps.release-version.outputs.current-version }}
          githubTagName: v${{ steps.release-version.outputs.current-version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
